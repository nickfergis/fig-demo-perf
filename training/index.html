<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Training Platform Demo</title>
<style>
  :root {
    --bg: #F5F7FB; --ink: #14213D; --muted: #56627F; --accent: #B8520A;
    --overlay: rgba(9, 15, 30, 0.97); --panel: #111A2E; --panel-ink: #E8ECF5; --line: #2A3653;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font-family: Inter, "Segoe UI", "Liberation Sans", Arial, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #diagram { width: 100vw; height: 100vh; max-width: calc(100vh * 16 / 9); max-height: calc(100vw * 9 / 16); }

  .box { cursor: pointer; transition: opacity .25s, filter .25s; outline: none; }
  .box:hover, .box:focus-visible { filter: drop-shadow(0 6px 14px rgba(20, 33, 61, .22)); }
  .box.demo:hover { filter: drop-shadow(0 8px 18px rgba(184, 82, 10, .35)); }
  body.spot .box:not(.on) { opacity: .35; }
  .box.on { filter: drop-shadow(0 0 0 #fff) drop-shadow(0 0 12px rgba(31, 58, 110, .55)); }

  #hint { position: fixed; left: 16px; bottom: 12px; font-size: 13px; color: var(--muted);
    background: rgba(255,255,255,.85); border: 1px solid #D5DBE8; border-radius: 8px; padding: 6px 10px; }
  #hint.hidden { display: none; }
  kbd { font: inherit; font-weight: 700; padding: 0 5px; border: 1px solid #C7CEDD; border-radius: 4px; background: #fff; }

  #player { position: fixed; inset: 0; background: var(--overlay); display: none; z-index: 10; }
  #player.open { display: flex; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; color: var(--panel-ink); }
  #bar h2 { margin: 0; font-size: 18px; font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .btn { background: transparent; color: var(--panel-ink); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }
  .btn:hover { border-color: #5B6B90; }
  .btn.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
  #close { font-size: 16px; padding: 6px 14px; }
  #vwrap { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; padding: 0 16px 16px; }
  video { max-width: 100%; max-height: 100%; background: #000; border-radius: 6px; }
  #pending { color: var(--panel-ink); text-align: center; font-size: 22px; line-height: 1.5; display: none; }
  #pending small { display: block; color: #9AA6C2; font-size: 15px; margin-top: 8px; }

  #chap { width: 300px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; display: none; }
  #player.chapters #chap { display: block; }
  #chap h3 { margin: 0; padding: 14px 16px 8px; color: #9AA6C2; font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; }
  #chap button { display: flex; gap: 12px; width: 100%; text-align: left; background: none; border: 0;
    color: var(--panel-ink); padding: 8px 16px; font: inherit; font-size: 14px; cursor: pointer; }
  #chap button:hover { background: #1A2540; }
  #chap button.now { background: #22304F; box-shadow: inset 3px 0 0 var(--accent); }
  #chap .t { color: #9AA6C2; font-variant-numeric: tabular-nums; min-width: 42px; }
  /* Phone layout (MT-175): below about 700px wide, or on a short landscape phone, the 16:9 diagram
     shrinks to an unreadable size, so the same boxes are shown as one stacked column instead.
     Desktop and tablet keep the diagram unchanged. */
  #stack { display: none; }
  @media (max-width: 700px), (max-height: 500px) {
    html, body { height: auto; overflow: auto; }
    #stage, #hint { display: none; }
    #stack { display: block; max-width: 560px; margin: 0 auto; padding: 20px 16px 32px; }
    #stack h1 { margin: 0; font-size: 24px; line-height: 1.2; font-weight: 800; }
    #stack .sub { margin: 6px 0 4px; font-size: 16px; color: var(--muted); font-weight: 500; }
    #stack .tip { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
    #stack h2 { margin: 22px 0 8px; font-size: 13px; letter-spacing: 1.2px; font-weight: 800; }
    #stack .card { position: relative; display: flex; gap: 12px; width: 100%; text-align: left; margin: 0 0 10px;
      padding: 14px 14px 14px 16px; background: #fff; border: 1px solid #D5DBE8; border-left-width: 6px;
      border-radius: 12px; font: inherit; color: var(--ink); }
    #stack button.card { cursor: pointer; }
    #stack button.card:active { filter: drop-shadow(0 4px 10px rgba(184, 82, 10, .3)); }
    #stack .num { flex: none; width: 30px; height: 30px; border-radius: 50%; color: #fff; font-weight: 800;
      font-size: 16px; display: flex; align-items: center; justify-content: center; }
    #stack .ttl { font-size: 18px; font-weight: 700; line-height: 1.25; }
    #stack .dsc { margin-top: 4px; font-size: 15px; line-height: 1.4; color: var(--muted); }
    #stack .pill { display: inline-block; margin-top: 8px; background: var(--accent); color: #fff; border-radius: 14px;
      padding: 4px 12px; font-size: 13px; font-weight: 700; letter-spacing: 1px; }
    #stack .loop { margin: 4px 0 0; padding: 10px 12px; border-radius: 10px; background: #EFEAF8; color: #6B4BB8;
      font-size: 14px; font-weight: 700; line-height: 1.4; }
    #stack .ext { margin: 0 0 8px; padding: 10px 12px; background: #fff; border: 1.5px dashed #7C8AA8; border-radius: 10px;
      font-size: 15px; font-weight: 600; }
    #stack .ref { margin: 0 0 10px; font-size: 14px; color: var(--muted); line-height: 1.4; }
    #stack .out { margin: 0 0 10px; padding: 12px 14px; background: #fff; border: 1px solid #D5DBE8; border-radius: 12px; }
    #stack .big { font-size: 28px; font-weight: 800; }
    #stack .lbl { font-size: 16px; font-weight: 600; margin-top: 2px; }
    #stack .ctx { font-size: 14px; color: var(--muted); margin-top: 2px; }
    #stack .foot { margin-top: 16px; font-size: 14px; font-weight: 700; color: var(--muted); }
    #bar { flex-wrap: wrap; }
    #bar h2 { flex-basis: 100%; }
    #spdlabel { display: none; }
    #player.chapters { flex-direction: column; }
    #chap { width: auto; max-height: 40%; border-left: 0; border-top: 1px solid var(--line); }
  }
</style>
</head>

const player = document.getElementById("player"), vid = document.getElementById("vid");
const pending = document.getElementById("pending"), list = document.getElementById("chaplist");
let current = null, rate = 1, pendingGo = null;

function fmt(s) { s = Math.round(s); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

function setRate(r) {
  rate = r; vid.playbackRate = r;
  document.querySelectorAll(".spd").forEach(b => b.classList.toggle("sel", +b.dataset.r === r));
}

function openDemo(id) {
  const d = DEMOS[id]; if (!d) return;
  current = d;
  document.getElementById("ptitle").textContent = d.title;
  list.innerHTML = "";
  (d.chapters || []).forEach(c => {
    const b = document.createElement("button");
    b.innerHTML = '<span class="t">' + fmt(c[0]) + "</span><span>" + c[1] + "</span>";
    b.onclick = () => { vid.currentTime = c[0]; vid.play(); };
    b.dataset.t = c[0]; list.appendChild(b);
  });
  document.getElementById("chapbtn").style.display = (d.chapters || []).length ? "" : "none";
  document.querySelectorAll(".spd, #spdlabel").forEach(el => el.style.display = d.pending ? "none" : "");
  player.classList.add("open");
  if (d.pending) {
    vid.style.display = "none"; pending.style.display = "block";
    pending.innerHTML = d.title + " video is being produced.<small>" + (d.note || "") + "</small>";
    return;
  }
  vid.style.display = ""; pending.style.display = "none";
  if (vid.dataset.src !== d.src) { vid.src = d.src; vid.dataset.src = d.src; }
  const go = () => { vid.currentTime = d.start || 0; setRate(d.rate || 1); vid.play(); };
  if (pendingGo) vid.removeEventListener("loadedmetadata", pendingGo);
  pendingGo = null;
  if (vid.readyState >= 1) go();
  else { pendingGo = go; vid.addEventListener("loadedmetadata", go, { once: true }); }
  vid.focus();
}

function closeDemo() { vid.pause(); player.classList.remove("open", "chapters"); current = null; }

vid.addEventListener("timeupdate", () => {
  const t = vid.currentTime; let now = null;
  list.querySelectorAll("button").forEach(b => { if (+b.dataset.t <= t + 0.2) now = b; b.classList.remove("now"); });
  if (now) now.classList.add("now");
});

document.querySelectorAll(".box").forEach(g => {
  const id = g.dataset.box;
  const act = () => {
    if (g.classList.contains("demo") && DEMOS[id]) { openDemo(id); return; }
    const was = g.classList.contains("on");
    document.querySelectorAll(".box.on").forEach(x => x.classList.remove("on"));
    document.body.classList.toggle("spot", !was);
    if (!was) g.classList.add("on");
  };
  g.addEventListener("click", e => { e.stopPropagation(); act(); });
  g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
});
document.getElementById("stage").addEventListener("click", () => {
  document.querySelectorAll(".box.on").forEach(x => x.classList.remove("on"));
  document.body.classList.remove("spot");
});
document.getElementById("close").onclick = closeDemo;
document.getElementById("chapbtn").onclick = () => player.classList.toggle("chapters");
document.querySelectorAll(".spd").forEach(b => b.onclick = () => setRate(+b.dataset.r));

document.addEventListener("keydown", e => {
  if (player.classList.contains("open")) {
    if (e.key === "Escape") closeDemo();
    else if (e.key.toLowerCase() === "c" && (current.chapters || []).length) player.classList.toggle("chapters");
    return;
  }
  if (DEMOS[e.key]) openDemo(e.key);
  else if (e.key.toLowerCase() === "f") {
    if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen();
  } else if (e.key.toLowerCase() === "h") document.getElementById("hint").classList.toggle("hidden");
  else if (e.key === "Escape") document.getElementById("stage").click();
});

/* Phone layout (MT-175): build the stacked column from the diagram itself, so the wording has one
   source. Demo cards open the same player as the diagram's DEMO boxes. */
(function buildStack() {
  const svg = document.getElementById("diagram"), out = document.getElementById("stack");
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const joinLines = a => a.reduce((s, x) => !s ? x : s.endsWith("-") ? s + x : s + " " + x, "");
  const texts = (root, size) => [...root.querySelectorAll("text")].filter(t => t.getAttribute("font-size") === size);
  const top = [...svg.children].filter(n => n.tagName === "text");
  const inRect = (r, list) => { const y = +r.getAttribute("y"), h = +r.getAttribute("height"), x = +r.getAttribute("x"), w = +r.getAttribute("width");
    return list.filter(t => +t.getAttribute("y") > y && +t.getAttribute("y") < y + h && +t.getAttribute("x") > x && +t.getAttribute("x") < x + w); };

  out.append(el("h1", null, texts(svg, "44")[0].textContent), el("p", "sub", texts(svg, "24")[0].textContent),
             el("p", "tip", "Tap a DEMO card to play it."));

  const stages = top.filter(t => t.getAttribute("font-size") === "16" && t.getAttribute("letter-spacing") === "1.2");
  const boxes = [...svg.querySelectorAll(".box")];
  stages.forEach(st => {
    const color = st.getAttribute("fill");
    const h = el("h2", null, st.textContent); h.style.color = color; out.append(h);
    boxes.filter(g => g.querySelector("circle").getAttribute("fill") === color).forEach(g => {
      const id = g.dataset.box, demo = g.classList.contains("demo") && DEMOS[id];
      const card = el(demo ? "button" : "div", "card"); card.style.borderLeftColor = color;
      if (demo) { card.type = "button"; card.addEventListener("click", () => openDemo(id)); }
      const n = el("span", "num", id); n.style.background = color; n.setAttribute("aria-hidden", "true");
      const body = el("div");
      body.append(el("div", "ttl", joinLines(texts(g, "20").map(t => t.textContent))),
                  el("div", "dsc", joinLines(texts(g, "15").map(t => t.textContent))));
      if (demo) body.append(el("span", "pill", "\u25B6  DEMO"));
      card.append(n, body); out.append(card);
    });
  });
  const loop = top.find(t => t.textContent.startsWith("CLOSED LOOP"));
  if (loop) out.append(el("p", "loop", "\u21BB " + loop.textContent.replace(/\s+\u00B7\s+/, ": ")));

  const ext = top.find(t => t.textContent === "EXTEND");
  if (ext) {
    const h = el("h2", null, "EXTEND"); h.style.color = ext.getAttribute("fill"); out.append(h);
    const extText = top.filter(t => t.getAttribute("font-size") === "16" && t.getAttribute("font-weight") === "600");
    [...svg.querySelectorAll('rect[stroke-dasharray]')].forEach(r => out.append(el("div", "ext", joinLines(inRect(r, extText).map(t => t.textContent)))));
  }

  const refHead = top.find(t => t.textContent === "REFERENCE OUTCOMES");
  if (refHead) {
    const h = el("h2", null, refHead.textContent); h.style.color = refHead.getAttribute("fill"); out.append(h);
    const note = top.find(t => t !== refHead && t.getAttribute("y") === refHead.getAttribute("y"));
    if (note) out.append(el("p", "ref", note.textContent));
    [...svg.querySelectorAll('rect[width="340"]')].forEach(r => {
      const inside = inRect(r, top), pick = sz => (inside.find(t => t.getAttribute("font-size") === sz) || {}).textContent || "";
      const c = el("div", "out"); c.append(el("div", "big", pick("38")), el("div", "lbl", pick("17")), el("div", "ctx", pick("14"))); out.append(c);
    });
    const foot = top.find(t => +t.getAttribute("y") > 980);
    if (foot) out.append(el("p", "foot", foot.textContent));
  }
})();
